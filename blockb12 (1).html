<script>
"use strict";
window.addEventListener("error",function(e){var b=document.getElementById("booterr");b.style.display="block";b.textContent="BOOT ERROR:\n"+(e.message||e)+"\nline "+(e.lineno||"?");});
function $(i){return document.getElementById(i);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function money(n){return "$"+Math.floor(n).toLocaleString();}
function esc(s){return String(s).replace(/</g,"&lt;");}
/* ---------- DATA ---------- */
var NAMES=["Maddog","Two-Strikes","Pox","Kicker","Whisper","Bruiser","Slate","Ghost","Ratchet","Havoc"];
var LOOT=[["cash",30],["shank",22],["drink",16],["bar",14],["contra",10],["favor",8]];
var INAME={drink:"Energy Drink",bar:"Protein Bar",contra:"Contraband",shank:"Shiv"};
var JOBS=[{t:"Corridor Lookout",n:6,c:30,r:.16,s:"spd",sev:18},{t:"Laundry Smuggle",n:8,c:44,r:.22,s:"spd",sev:24},{t:"Bunk Shakedown",n:9,c:52,r:.26,s:"def",sev:28},{t:"Debt Collection",n:11,c:64,r:.30,s:"def",sev:32},{t:"Yard Contraband Run",n:12,c:72,r:.32,s:"spd",sev:36},{t:"Kitchen Riot Bait",n:14,c:88,r:.38,s:"def",sev:42}];
var AMEN=[{id:"bed",n:"Comfy Bed",c:2,d:"+5 Max NRG",st:"nrg",v:5},{id:"weights",n:"Weight Rack",c:3,d:"+5 Max STM",st:"stm",v:5},{id:"radio",n:"Radio",c:3,d:"+5 Max NRV",st:"nrv",v:5},{id:"locker",n:"Hidden Locker",c:5,d:"Blocks shakedown theft",st:"none",v:0}];
var FACS={bloods:{n:"Bloods",c:"#ef4444"},crips:{n:"Crips",c:"#38bdf8"},latin:{n:"Latin Kings",c:"#fbbf24"},aryan:{n:"Aryan Brotherhood",c:"#e5e7eb"}};
var RECIPES=[{id:"rshiv",n:"Reinforced Shiv",p:{shank:1,contra:1},d:"+10 brawl edge"},{id:"stim",n:"Stimulant",p:{drink:1,contra:1},d:"+30% power, 3 brawls"},{id:"smoke",n:"Smoke Bomb",p:{contra:2},d:"Negates one loss"}];
var WANTED=[{n:'"MADDOG" Johnson',cr:"Assault, Murder",b:50000},{n:'"GHOST" Williams',cr:"Trafficking",b:35000},{n:'"BRUISER" Thompson',cr:"Armed Robbery",b:42000}];
var HITS=[{n:'"SLICK" Martinez',rw:25000,d:4},{n:'"WHISPER" Jones',rw:18000,d:3},{n:'"RATCHET" Davis',rw:30000,d:5}];
var EVENTS=[
 {id:"shakedown",title:"GUARD SHAKEDOWN INBOUND",contact:0,win:25,text:"CO Jenkins called the sweep — Block B in ~25s. Your call, boss?",opts:[{c:"STASH",l:"STASH IT (-1 fav)",f:function(){if(G.fav>=1){G.fav--;log("Crew moved everything to the locker.","g");}else{G.cash=Math.max(0,G.cash-400);G.heat+=6;log("Partial bust -$400","+r");}}},{c:"BRIBE",l:"BRIBE $500",f:function(){if(G.cash>=500){G.cash-=500;G.heat=Math.max(0,G.heat-8);log("Jenkins bribed (-8% heat)","b");}else{loseProd();}}},{c:"IGNORE",l:"RIDE IT OUT",f:loseProd}],to:loseProd},
 {id:"raid",title:"RIVAL RAID ON THE LAUNDRY",contact:2,win:30,text:"Maddog's crew is moving on the laundry racket NOW. Orders?",opts:[{c:"DEFEND",l:"DEFEND (-50 inf)",f:function(){G.inf=Math.max(0,G.inf-50);if(Math.random()<.7){G.cash+=300;log("Raid repelled +$300","g");}else{G.income-=100;log("Press damaged (-$100/day)","a");}}},{c:"PAY",l:"PAY $800",f:function(){if(G.cash>=800){G.cash-=800;log("Tribute paid","a");}else{G.income-=150;log("Racket squeezed","r");}}},{c:"IGNORE",l:"LET IT BURN",f:function(){G.income=Math.max(100,G.income-150);log("Laundry looted (-$150/day)","r");}}],to:function(){G.income=Math.max(100,G.income-150);log("Laundry looted","r");}},
 {id:"shipment",title:"KITCHEN VENT SHIPMENT",contact:1,win:20,text:"Supplier at the vent. Four-minute window. Buy in or pass?",opts:[{c:"BUY",l:"BUY IN $600",f:function(){if(G.cash>=600){G.cash-=600;G.fav+=2;G.inv.contra+=2;log("Shipment secured (+2 fav, +2 contra)","g");}else log("Not enough cash","r");}},{c:"PASS",l:"PASS",f:function(){log("Shipment passed","d");}}],to:function(){log("Window closed","d");}}];
var CATALOG=[{id:"jfKfPfyJRdk",t:"lofi hip hop radio",ch:"Lofi Girl",tags:"music lofi radio chill"},{id:"M7lc1UVf-VE",t:"YouTube Developers Live",ch:"Google",tags:"youtube api dev documentary"},{id:"aqz-KE-bpKQ",t:"Big Buck Bunny 4K",ch:"Blender",tags:"movie animation film"},{id:"dQw4w9WgXcQ",t:"Rick Astley - Never Gonna Give You Up",ch:"Rick Astley",tags:"music 80s classic"}];
var TABS=[["gym","Gym"],["yard","Yard"],["market","Market"],["warden","Warden"],["infirm","Infirmary"],["cell","Cell"],["kingpin","Kingpin"],["factions","Factions"],["wire","Wire"],["recroom","Rec Room"],["wanted","Wanted"],["browser","PrisonNet"]];
/* ---------- STATE ---------- */
function newG(){return{lv:1,exp:0,str:5,def:5,spd:5,hp:100,mhp:100,nrg:20,mnrg:20,stm:60,mstm:60,nrv:20,mnrv:20,cash:40,bank:0,fav:0,inf:0,heat:0,inv:{drink:1,bar:1,contra:0,shank:0},inj:false,rest:0,tr:0,
 pits:[0,0,0,0,0,0,0,0,0],dug:0,won:0,rivals:[],rivalAt:0,jobs:[],jobAt:0,placed:[],cosm:[],buffs:{},mentor:null,
 racks:[{id:"laundry",n:"Laundry Laundering",y:200,l:1},{id:"fight",n:"Fight Club",y:150,l:1},{id:"smug",n:"Smuggling Ring",y:100,l:1}],income:450,tx:[],
 fac:{},curFac:null,snitch:false,sent:0,parole:60,
 wire:[{n:'"Slick" Martinez',r:"Lieutenant",on:1,m:[]},{n:'"Ghost" Williams',r:"Smuggler",on:1,m:[]},{n:'"Bruiser" Thompson',r:"Enforcer",on:1,m:[]}],wact:-1,
 table:{ph:"idle",seats:[],pot:0,end:0},wcd:[0,0,0],hits:[{s:0,t:0},{s:0,t:0},{s:0,t:0}],
 ytkey:"",last:Date.now(),log:[]};}
var G=null,tab="gym",EV=null,net={st:"sim",ws:null};
function save(){try{G.last=Date.now();localStorage.setItem("b12stable",JSON.stringify(G));}catch(e){}}
function load(){var g=newG();try{var r=localStorage.getItem("b12stable");if(r){var o=JSON.parse(r);for(var k in g)if(o[k]!==undefined&&o[k]!==null)g[k]=o[k];}}catch(e){}G=g;
 var dt=Math.max(0,(Date.now()-(G.last||Date.now()))/1000);if(dt>1)regen(Math.min(dt,28800));}
function regen(s){G.nrg=clamp(G.nrg+(.35+G.lv*.01)*s,0,G.mnrg);G.stm=clamp(G.stm+(1.1+G.spd*.03)*s,0,G.mstm);G.nrv=clamp(G.nrv+(.22+G.lv*.005)*s,0,G.mnrv);if(!G.inj)G.hp=clamp(G.hp+.25*s,0,G.mhp);}
function expN(){return Math.floor(80+G.lv*45);}
function pow(o){return(o.str||o.str===0?o.str:G.str)*1.35+(o.def||G.def)*1.15+(o.spd||G.spd)*.5;}
/* ---------- LOG / TOAST ---------- */
var LCOL={g:"#4ade80",r:"#ef4444",a:"#f59e0b",b:"#38bdf8",d:"#8b949e",go:"#fbbf24",pu:"#a855f7"};
function log(t,c){G.log.unshift({t:t,c:c||"g"});if(G.log.length>40)G.log.pop();renderLog();}
function renderLog(){$("log").innerHTML=G.log.map(function(e){return '<div style="color:'+(LCOL[e.c]||LCOL.g)+'">&gt; '+esc(e.t)+"</div>";}).join("");}
var toastT=null;function toast(t,c){var el=$("toast");el.textContent=t;el.style.borderColor=LCOL[c]||LCOL.g;el.style.color=LCOL[c]||LCOL.g;el.style.display="block";clearTimeout(toastT);toastT=setTimeout(function(){el.style.display="none";},1800);}
/* ---------- CORE ACTIONS ---------- */
function chkLv(){while(G.exp>=expN()){G.exp-=expN();G.lv++;G.mhp+=5;G.mnrg+=2;G.mstm+=3;G.mnrv+=2;G.hp=G.mhp;G.nrg=G.mnrg;G.stm=G.mstm;G.nrv=G.mnrv;if(G.lv%3===0)G.fav++;toast("LEVEL UP — Lv."+G.lv,"go");log("LEVEL UP -> Lv."+G.lv,"go");}}
function train(i){if(G.inj)return deny("Injured — see Infirmary");if(G.nrg<1)return deny("Not enough energy");if(G.stm<6)return deny("Not enough stamina");G.nrg--;G.stm-=6;var g=1+Math.floor(G.lv/5);if(i===0){G.str+=g;G.mhp+=2;}else if(i===1)G.def+=g;else{G.spd+=g;G.mstm+=3;}G.exp+=5+G.lv;G.tr++;log("Trained "+["STR","DEF","SPD"][i]+" +"+g,"g");chkLv();render();}
function deny(m){toast(m,"r");log("BLOCKED: "+m,"r");}
function rest(){var n=Date.now();if(n<G.rest)return deny("Rest on cooldown");G.rest=n+60000;G.stm=clamp(G.stm+G.mstm*.45,0,G.mstm);G.nrv=clamp(G.nrv+G.mnrv*.45,0,G.mnrv);log("Bunk rest (+STM +NRV)","g");render();}
function mkt(){var m=Math.pow(1.085,G.lv-1)+(G.lv-1)*.06;var l=[{id:"drink",n:"Energy Drink",d:"50% NRG",p:Math.round(22*m),cur:"cash",res:"nrg",am:.5},{id:"bar",n:"Protein Bar",d:"50% STM",p:Math.round(16*m),cur:"cash",res:"stm",am:.5},{id:"contra",n:"Contraband",d:"60% NRV",p:Math.round(38*m),cur:"cash",res:"nrv",am:.6}];if(G.lv>=3)l.push({id:"medkit",n:"Smuggled Medkit",d:"75% HP",p:1,cur:"fav",res:"hp",am:.75});return l;}
function buy(id){var it=mkt().filter(function(x){return x.id===id;})[0];if(!it)return;if(it.cur==="fav"){if(G.fav<it.p)return deny("Not enough favors");G.fav-=it.p;}else{if(G.cash<it.p)return deny("Not enough cash");G.cash-=it.p;}G.inv[id]=(G.inv[id]||0)+1;log("Bought "+it.n,"a");render();}
function use(id){if((G.inv[id]||0)<=0)return deny("None in stash");var it=mkt().filter(function(x){return x.id===id;})[0];if(!it)return;G.inv[id]--;var full={nrg:"mnrg",stm:"mstm",nrv:"mnrv",hp:"mhp"}[it.res];var am=G[full]*it.am;G[it.res]=clamp(G[it.res]+am,0,G[full]);log("Used "+it.n,"g");render();}
function healC(){return Math.max(10,Math.round((G.mhp-G.hp)*1.6)+10);}
function heal(f){if(G.hp>=G.mhp&&!G.inj)return deny("Already patched up");if(f){if(G.fav<1)return deny("No favors");G.fav--;}else{var c=healC();if(G.cash<c)return deny("Not enough cash");G.cash-=c;}G.hp=G.mhp;G.inj=false;log("Infirmary: healed to full","g");render();}
function rollJob(){var a=pick(JOBS),sc=1+(G.lv-1)*.14;return{t:a.t,n:Math.max(5,Math.round(a.n*(1+(G.lv-1)*.07))),c:Math.round(a.c*sc),r:clamp(a.r+G.lv*.005,.12,.55),s:a.s,sev:Math.round(a.sev*sc)};}
function refJobs(){G.jobs=[rollJob(),rollJob()];G.jobAt=Date.now()+45000;}
function job(i){var j=G.jobs[i];if(!j)return;if(G.nrv<j.n)return deny("Not enough nerve");G.nrv-=j.n;var sc=j.s==="spd"?G.spd*1.4+G.def*.6:j.s==="def"?G.def*1.4+G.spd*.6:G.spd+G.def;var od=clamp((.88-j.r*.72)*(.6+.4*clamp(sc/(8+G.lv*3.2),.5,1.8)),.1,.94);
 if(Math.random()<od){G.cash+=j.c;G.exp+=Math.round(j.c*.2);log("Job done: "+j.t+" (+$"+j.c+")","a");chkLv();}else{var d=Math.max(6,Math.round(j.sev*(.85+Math.random()*.35)-G.def*.75));G.hp=Math.max(1,G.hp-d);G.inj=true;log("Job failed -"+d+" HP, INJURED","r");}
 G.jobs.splice(i,1);if(!G.jobs.length)refJobs();render();}
function rollRival(){return{n:pick(NAMES),lv:Math.max(1,G.lv+rnd(-2,2)),str:4+Math.floor(G.lv*1.1+Math.random()*4),def:4+Math.floor(G.lv*1.1+Math.random()*4),spd:4+Math.floor(G.lv*1.1+Math.random()*4)};}
function refRivals(){G.rivals=[rollRival(),rollRival(),rollRival()];G.rivalAt=Date.now()+60000;G.pits=[0,0,0,0,0,0,0,0,0];}
function dig(i){if(G.stm<4)return deny("Not enough stamina");G.stm-=4;G.pits[i]=1;if(Math.random()<.22){log("Pit #"+(i+1)+" empty","d");}else{var r=Math.random()*100,loot="cash";for(var x=0;x<LOOT.length;x++){r-=LOOT[x][1];if(r<=0){loot=LOOT[x][0];break;}}G.dug++;G.exp+=8+G.lv*2;
 if(loot==="cash"){var c=Math.round(14+G.lv*6+Math.random()*(20+G.lv*8));G.cash+=c;log("Buried cash +$"+c,"a");}else if(loot==="favor"){G.fav++;log("Favor marker +1","g");}else{G.inv[loot]=(G.inv[loot]||0)+1;log("Found "+(INAME[loot]||loot),"g");}chkLv();}render();}
function brawl(i){var f=G.rivals[i];if(!f)return;if(G.stm<8)return deny("Not enough stamina");if(G.inj)return deny("Too injured");G.stm-=8;var edge=G.buffs.rshiv?10:(G.inv.shank?6:0);var me=pow(G)+edge+(G.buffs.stim?pow(G)*.3:0)+Math.random()*14,th=pow(f)+Math.random()*14;
 if(me>=th){G.won++;var c=Math.round((20+f.lv*12)*(.8+Math.random()*.6));G.cash+=c;G.exp+=14+f.lv*5;if(G.buffs.stim)G.buffs.stim--;log("Beat "+f.n+" +$"+c,"g");chkLv();}else{if(G.buffs.smoke){G.buffs.smoke--;log("Smoke bomb — slipped away","a");}else{var d=Math.max(5,Math.round((8+f.lv*4+f.str*1.4)*(.8+Math.random()*.5)-G.def*.75));G.hp=Math.max(1,G.hp-d);if(G.hp<=G.mhp*.25)G.inj=true;log("Lost to "+f.n+" -"+d+" HP","r");}}
 G.rivals.splice(i,1);if(!G.rivals.length)refRivals();render();}
function loseProd(){var lock=G.placed.indexOf("locker")>=0;G.heat=Math.min(100,G.heat+8);if(lock)log("Shakedown: locker held (+8% heat)","a");else{G.cash=Math.max(0,G.cash-600);log("Shakedown bust -$600 (+8% heat)","r");}}
/* kingpin */
function collect(){G.cash+=G.income;G.heat=Math.min(100,G.heat+2);tx(1,G.income,"Racket income");log("Collected "+money(G.income),"go");render();}
function tx(s,a,d){G.tx.unshift({s:s,a:a,d:d});if(G.tx.length>10)G.tx.pop();}
function bank(dep){var v=parseInt(prompt(dep?"Deposit:":"Withdraw:","100"),10);if(!v||v<=0)return;if(dep){if(v>G.cash)return deny("Not enough cash");G.cash-=v;G.bank+=v;tx(1,v,"Deposit");}else{if(v>G.bank)return deny("Not enough in bank");G.bank-=v;G.cash+=v;tx(-1,v,"Withdrawal");}render();}
function rack(id){var r=G.racks.filter(function(x){return x.id===id;})[0];var c=r.l*1000;if(G.cash<c)return deny("Need "+money(c));G.cash-=c;r.l++;r.y+=Math.floor(c*.15);G.income+=Math.floor(c*.15);tx(-1,c,"Upgrade");log("Upgraded "+r.n,"g");render();}
function bribe(){if(G.cash<500)return deny("Need $500");G.cash-=500;G.heat=Math.max(0,G.heat-10);log("Bribed Jenkins (-10% heat)","b");render();}
function frame(){if(G.fav<1)return deny("Need 1 favor");G.fav--;G.heat=Math.max(0,G.heat-15);log("Framed Maddog (-15% heat)","pu");render();}
function parole(){if(G.sent<G.parole)return deny("Not eligible yet");var sc=G.lv*10+G.str+G.def+G.spd+(G.curFac?G.fac[G.curFac]||0:0)-(G.snitch?200:0);if(Math.random()<clamp(sc/1000,.1,.9)){toast("PAROLE GRANTED!","go");log("PAROLE GRANTED — new run","go");var b=G.lv;G=newG();G.lv=1;G.mhp=100+ (b>=3?20:0);G.hp=G.mhp;}else{G.parole+=30;log("Parole denied","r");}render();}
function joinF(id){if(G.snitch&&id!=="guards")return deny("Gangs refuse a snitch");G.curFac=id;G.fac[id]=(G.fac[id]||0)+50;log("Joined "+FACS[id].n,"a");render();}
function craft(id){var r=RECIPES.filter(function(x){return x.id===id;})[0];for(var k in r.p)if((G.inv[k]||0)<r.p[k])return deny("Missing parts");for(var k2 in r.p)G.inv[k2]-=r.p[k2];G.buffs[id]=(G.buffs[id]||0)+1;log("Crafted "+r.n,"g");render();}
function hunt(i){if(Date.now()<G.wcd[i])return deny("Target gone quiet");if(G.stm<10)return deny("Need 10 STM");G.stm-=10;G.wcd[i]=Date.now()+60000;if(Math.random()<.4+G.spd*.01){G.cash+=WANTED[i].b;G.inf+=200;log("Bounty collected "+money(WANTED[i].b),"go");}else{var d=rnd(20,35);G.hp=Math.max(1,G.hp-d);G.inj=true;log("Hunt failed -"+d+" HP","r");}render();}
function hit(i){if(G.hits[i].s!==0)return;G.hits[i].s=1;G.hits[i].t=0;log("Contract accepted: "+HITS[i].n,"a");render();}
/* wire */
var BOTS=["Got it, boss.","I'll handle it quietly.","That's gonna cost extra.","Consider it done.","Guards are watching — make it quick."];
function wireSend(txt){if(G.wact<0||!txt)return;var c=G.wire[G.wact];c.m.push({o:1,t:txt});if(EV&&EV.d.contact===G.wact){var o=EV.d.opts.filter(function(x){return x.c===txt.toUpperCase();})[0];if(o){evResolve(o.c);return;}}if(net.st==="live"&&net.ws)try{net.ws.send(JSON.stringify({t:"dm",to:c.n,text:txt}));}catch(e){}
 else if(c.on)setTimeout(function(){c.m.push({o:0,t:pick(BOTS)});if(tab==="wire")renderChat();},rnd(900,2000));renderChat();}
function evTrigger(){if(EV)return;var pool=EVENTS.filter(function(d){return G.heat>=(d.hmin||0);});var d=pick(pool.length?pool:EVENTS);EV={d:d,left:d.win};var c=G.wire[d.contact];c.m.push({o:0,t:d.text,u:1});toast("⚠ URGENT WIRE: "+c.n,"r");log("EVENT: "+d.title,"r");showBanner();}
function showBanner(){var b=$("banner");b.style.display="block";$("btitle").textContent="⚠ "+EV.d.title;$("btext").textContent=EV.d.text;$("bopts").innerHTML=EV.d.opts.map(function(o){return '<button class="act red" data-act="ev:'+o.c+'">'+o.l+"</button>";}).join("");}
function evResolve(c){if(!EV)return;var o=EV.d.opts.filter(function(x){return x.c===c;})[0];var w=G.wire[EV.d.contact];w.m.push({o:1,t:c});if(o)o.f();EV=null;$("banner").style.display="none";if(tab==="wire")renderChat();render();}
/* rec room table */
function tblJoin(){var t=G.table;if(t.ph==="rolling")return deny("Hand in progress");if(t.seats.some(function(s){return s.me;}))return deny("Already in this hand");var bet=Math.max(50,parseInt(prompt("Bet (min 50):","50"),10)||50);if(G.cash<bet)return deny("Not enough cash");if(t.ph==="idle"){t.ph="bet";t.end=Date.now()+10000;t.pot=0;t.seats=[];for(var i=0,n=rnd(1,3);i<n;i++)(function(){setTimeout(function(){if(G.table.ph!=="bet")return;var b=pick(G.wire);var bb=G.table.minBet||50;G.table.seats.push({n:b.n,b:rnd(50,200),roll:null});G.table.pot+=0;},rnd(1200,7000));})();}
 G.cash-=bet;t.seats.push({n:"YOU",b:bet,roll:null,me:1});t.pot+=bet;log("Sat at craps ("+money(bet)+")","b");render();}
function tblRoll(){var t=G.table;if(t.ph!=="bet"||t.seats.length<2){t.ph="idle";t.seats=[];t.pot=0;return;}t.ph="rolling";t.pot=t.seats.reduce(function(s,x){return s+x.b;},0);var i=0;(function step(){if(i>=t.seats.length){setTimeout(tblPay,600);return;}var s=t.seats[i];var a=rnd(1,6),b=rnd(1,6);s.roll=a+b;s.dis=a+"+"+b;i++;render();setTimeout(step,500);})();}
function tblPay(){var t=G.table;var best=Math.max.apply(null,t.seats.map(function(s){return s.roll;}));var ws=t.seats.filter(function(s){return s.roll===best;});if(ws.length>1){toast("Push — pot carries","d");t.ph="bet";t.end=Date.now()+8000;t.seats.forEach(function(s){s.roll=null;});return;}var w=ws[0];if(w.me){G.cash+=t.pot;tx(1,t.pot,"Craps win");toast("YOU WIN "+money(t.pot),"go");log("Won "+money(t.pot)+" at craps","go");}else log(w.n+" takes "+money(t.pot),"go");t.ph="idle";t.seats=[];t.pot=0;render();}
/* youtube */
function execYtSearch(q){if(G.ytkey){fetch("https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=6&q="+encodeURIComponent(q)+"&key="+G.ytkey).then(function(r){return r.json();}).then(function(d){G.ytres=(d.items||[]).map(function(it){return{id:it.id.videoId,t:it.snippet.title,ch:it.snippet.channelTitle};});G.ytnote="LIVE — YouTube Data API v3";render();}).catch(function(){ytGo(q);});}else ytGo(q);}
function ytGo(q){q=(q||"").trim();if(!q)return;if(/^[A-Za-z0-9_-]{11}$/.test(q)){ytPlay(q);return;}var res=CATALOG.filter(function(c){return q.toLowerCase().split(" ").some(function(w){return c.tags.indexOf(w)>=0||c.t.toLowerCase().indexOf(w)>=0;});});G.ytres=res.length?res:CATALOG.slice(0,3);G.ytnote="Offline catalog (set API key for live search)";render();}
function ytPlay(id){$("ytframe").src="https://www.youtube-nocookie.com/embed/"+id+"?autoplay=1";$("yturl").textContent="https://www.youtube.com/watch?v="+id;$("ytmodal").style.display="flex";log("Streaming "+id,"b");}

 else if(tab==="kingpin"){h="<h2>KINGPIN EMPIRE</h2><div class=card>"+row("Daily income <b class=cash>"+money(G.income)+"</b>",btn("collect","COLLECT","gold"))+row("Heat <b class=heat>"+Math.round(G.heat)+"%</b>",btn("bribe","BRIBE $500","blu",G.cash<500)+btn("frame","FRAME MADDOG","pu",G.fav<1))+row("Sentence served <b>"+Math.floor(G.sent)+"d</b> / parole @ "+G.parole+"d",btn("parole","REQUEST PAROLE","grn",G.sent<G.parole))+"</div><div class=card>"+G.racks.map(function(r){return row("<b>"+r.n+"</b> Lv."+r.l+" <span class=dim>"+money(r.y)+"/day</span>",btn("rack:"+r.id,"UPG $"+r.l*1000,"gold",G.cash<r.l*1000));}).join("")+"</div><div class=card><div class=dim>BANK "+money(G.bank)+"</div>"+row("",btn("bank:dep","DEPOSIT","blu")+btn("bank:wit","WITHDRAW","red"))+G.tx.slice(0,4).map(function(t){return row('<span class="mono" style="color:'+(t.s>0?"var(--g)":"var(--r)")+'">'+(t.s>0?"+":"-")+money(t.a)+"</span> <span class=dim>"+t.d+"</span>","");}).join("")+"</div>";}
