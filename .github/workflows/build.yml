name: Build Android APK & AAB

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug & Release APKs & AABs
        run: ./gradlew assembleDebug assembleRelease bundleDebug bundleRelease

      - name: Upload APKs Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Android-APKs
          path: app/build/outputs/apk/*/*/*.apk

      - name: Upload AABs Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Android-AABs
          path: app/build/outputs/bundle/*/*.aab
